name: bulgarian.orthodox.bible
description: This is orthodox bible. Have a nice reading and May the grace of the Lord Jesus Christ be with you.

version: 1.1.0+110

environment:
  sdk: ">=2.16.1 <3.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  wakelock_plus: ^1.1.4
  flutter_secure_storage: ^5.0.2
  package_info_plus: ^4.2.0
  path_provider: ^2.0.9
  http: ^0.13.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  icons_launcher: ^2.1.7
  flutter_lints: ^1.0.0
  easy_localization: ^3.0.3

flutter:
  uses-material-design: true

  assets:
    - assets/translations/
    - assets/images/
    - assets/flags/

icons_launcher:
  image_path: "assets/images/icon.png"
  platforms:
    android:
      enable: true
    ios:
      enable: true