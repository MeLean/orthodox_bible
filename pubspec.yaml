name: bulgarian.orthodox.bible
description: This is orthodox bible. Have a nice reading and May the grace of the Lord Jesus Christ be with you.

version: 2.2.7+227

environment:
  sdk: ">=2.16.1 <3.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  wakelock_plus: ^1.1.4
  package_info_plus: ^8.3.0
  path_provider: ^2.0.9
  http: ^1.3.0
  firebase_core: ^3.2.0
  firebase_database: ^11.0.3
  easy_localization: ^3.0.3
  shared_preferences: ^2.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  icons_launcher: ^3.0.1
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/translations/
    - assets/images/
    - assets/flags/

icons_launcher:
  image_path: "assets/images/icon.png"
  platforms:
    android:
      enable: true
    ios:
      enable: true