plugins {
    id "com.android.application"
    id 'com.google.gms.google-services'
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "bulgarian.orthodox.bible"
    compileSdk = flutter.compileSdkVersion
    // Prefer NDK r28+ for 16 KB alignment; falls back to Flutter's ndk if missing
    def ndkProp = providers.gradleProperty("ndkVersion").orNull
    ndkVersion = ndkProp ?: flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    } 

    kotlinOptions {
        jvmTarget = 17
    }

    defaultConfig {
        applicationId = "bulgarian.orthodox.bible"
        minSdkVersion = flutter.minSdkVersion
        targetSdk = 35
        versionCode = flutter.versionCode
        versionName = flutter.versionName

        signingConfigs {
            release {
                def keystoreProperties = new Properties()
                def keystorePropertiesFile = rootProject.file('key.properties')
                if (keystorePropertiesFile.exists()) {
                    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
                }
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    packagingOptions {
        jniLibs { useLegacyPackaging true }
    }


    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
        }
    }
}

flutter {
    source = "../.."
}
